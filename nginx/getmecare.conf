# ============================================================
#  Nginx config for GetMeCare — getmecare-ontario.com
#  Place at: /etc/nginx/sites-available/getmecare
#  Enable:   sudo ln -s /etc/nginx/sites-available/getmecare \
#                       /etc/nginx/sites-enabled/getmecare
#  Test:     sudo nginx -t && sudo systemctl reload nginx
# ============================================================

upstream getmecare_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

# ── GZIP compression (fixes HTML Compression test) ──────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_min_length 256;
gzip_types
    text/html
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype
    image/svg+xml
    image/x-icon;

# ── HTTP → HTTPS redirect ────────────────────────────────────
server {
    listen 80;
    server_name getmecare-ontario.com www.getmecare-ontario.com;

    # Let's Encrypt / Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://getmecare-ontario.com$request_uri;
    }
}

# ── www → non-www canonical redirect (fixes URL Canonicalization) ──
server {
    listen 443 ssl http2;
    server_name www.getmecare-ontario.com;

    ssl_certificate     /etc/letsencrypt/live/getmecare-ontario.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getmecare-ontario.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://getmecare-ontario.com$request_uri;
}

# ── HTTPS main server (non-www canonical) ───────────────────
server {
    listen 443 ssl http2;
    server_name getmecare-ontario.com;

    # --- SSL certs ---
    ssl_certificate     /etc/letsencrypt/live/getmecare-ontario.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getmecare-ontario.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Upload / buffer settings ─────────────────────────────
    client_max_body_size    25M;
    client_body_timeout     120s;
    client_body_buffer_size 128k;
    proxy_read_timeout      120s;
    proxy_connect_timeout   10s;
    proxy_send_timeout      120s;

    # ── Static files — served by Nginx directly ──────────────
    location /static/ {
        alias /home/getmecare/GetMeCare-Ontario/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        # Serve pre-compressed files if available
        gzip_static on;
    }

    # ── Media files ──────────────────────────────────────────
    location /media/ {
        alias /home/getmecare/GetMeCare-Ontario/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Everything else → Gunicorn ──────────────────────────
    location / {
        proxy_pass         http://getmecare_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering        on;
        proxy_buffers          8 16k;
        proxy_buffer_size      32k;
        proxy_http_version     1.1;
        proxy_set_header       Connection "";
    }

    # ── Security headers ─────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"        always;
    add_header X-Content-Type-Options "nosniff"           always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection       "1; mode=block"     always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
