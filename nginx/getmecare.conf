# ============================================================
#  Nginx config for GetMeCare — TrueHost VPS
#  Place this file at: /etc/nginx/sites-available/getmecare
#  Then: sudo ln -s /etc/nginx/sites-available/getmecare \
#                    /etc/nginx/sites-enabled/getmecare
#        sudo nginx -t && sudo systemctl reload nginx
# ============================================================

upstream getmecare_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────
server {
    listen 80;
    server_name YOUR_DOMAIN www.getmecare-ontario.com;

    # Let's Encrypt / Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # --- SSL certs (generated by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Upload / buffer settings (KEY fix for slow uploads) ──
    # Nginx buffers the entire upload from the client before
    # forwarding to Gunicorn — this frees up Gunicorn workers
    # immediately and makes uploads feel much faster.
    client_max_body_size    25M;     # max upload size (match your app limit)
    client_body_timeout     120s;    # time to receive the full request body
    client_body_buffer_size 128k;    # buffer in memory before spilling to disk
    proxy_read_timeout      120s;
    proxy_connect_timeout   10s;
    proxy_send_timeout      120s;

    # ── Static files — served directly by Nginx (no Gunicorn) ──
    location /static/ {
        alias /home/getmecare/app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Media files — served directly by Nginx ──────────────
    location /media/ {
        alias /home/getmecare/app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Everything else → Gunicorn ──────────────────────────
    location / {
        proxy_pass         http://getmecare_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Buffer responses too so Gunicorn workers are freed ASAP
        proxy_buffering        on;
        proxy_buffers          8 16k;
        proxy_buffer_size      32k;

        # Don't pass the connection header (keep-alive handling)
        proxy_http_version     1.1;
        proxy_set_header       Connection "";
    }

    # ── Security headers ─────────────────────────────────────
    add_header X-Frame-Options        "DENY"              always;
    add_header X-Content-Type-Options "nosniff"           always;
    add_header Referrer-Policy        "strict-origin"     always;
    add_header X-XSS-Protection       "1; mode=block"     always;
}
