services:
  - type: web
    name: getmecare
    env: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn GETMECARE.wsgi:application --workers 2 --threads 4 --timeout 120 --log-file -
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: getmecare-ontario.onrender.com,localhost,127.0.0.1
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: getmecare-db
    databaseName: getmecare
    user: getmecare_user