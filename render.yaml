services:
  - type: web
    name: getmecare
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn GETMECARE.wsgi:application --workers 2 --threads 4 --worker-class sync --worker-connections 1000 --max-requests 1000 --max-requests-jitter 50 --timeout 120 --keepalive 5 --log-file -
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: getmecare.onrender.com
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: getmecare-db
    databaseName: getmecare
    user: getmecare_user